name: CI
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true

      - run: pnpm run ci

  # Real browsers, so it runs once instead of per Node version. The Playwright
  # image ships the browsers and their system dependencies, which saves
  # installing them on every run. Its tag must match the locked `playwright`
  # version; when it doesn't, Playwright fails with a message naming both.
  integration:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm run test:integration

  # Separate job so a missing bump file doesn't hide test results, and so it
  # finishes in seconds without installing dependencies.
  bump-file:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: false
      - name: Check for bump file
        run: |
          VERSION=$(jq -r '.devDependencies["@varlock/bumpy"]' package.json | sed 's/[\^~]//')
          pnpm dlx "@varlock/bumpy@$VERSION" ci check
        env:
          GH_TOKEN: ${{ github.token }}
