name: Release
on:
  push:
    branches: ["main"]

concurrency:
  group: bumpy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this push should update the version PR, publish, or do
  # nothing. Needs no write permissions or publish credentials.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      bumpy_version: ${{ steps.bumpy-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          install: false
      - id: bumpy-version
        name: Resolve bumpy version
        run: |
          VERSION=$(jq -r '.devDependencies["@varlock/bumpy"]' package.json | sed 's/[\^~]//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: plan
        run: pnpm dlx "@varlock/bumpy@$BUMPY_VERSION" ci plan
        env:
          BUMPY_VERSION: ${{ steps.bumpy-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  # Opens or updates the "Version Packages" PR. No publish credentials.
  version-pr:
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm dlx "@varlock/bumpy@$BUMPY_VERSION" ci release --expect-mode version-pr
        env:
          BUMPY_VERSION: ${{ needs.plan.outputs.bumpy_version }}
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }} # lets CI run on the version PR

  # Publishes to npm via trusted publishing (OIDC) with provenance. Only this
  # job can request an id-token, and npm only trusts the `publish` environment.
  publish:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Puts a writable Node 24 toolchain on PATH, so the npm upgrade below
      # replaces the npm that bumpy actually calls.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: npm install -g npm@latest # trusted publishing needs a recent npm
      - run: pnpm run ci
      # Dependencies are installed here, so use the locked bumpy directly.
      - run: pnpm exec bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
