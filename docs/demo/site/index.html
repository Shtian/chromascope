<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme Pricing</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#1d2433}
header{background:#1d2433;color:#fff;padding:18px 40px;font-weight:700;font-size:20px}
main{display:flex;gap:24px;padding:40px}
.card{background:#fff;border-radius:12px;padding:24px;flex:1;box-shadow:0 2px 8px #0001}
h2{margin:0 0 8px}.price{font-size:36px;font-weight:800}
input,select{display:block;margin:10px 0;width:100%;font-size:15px}
button{margin-top:12px;padding:10px 16px;font-size:15px}
</style></head><body>
<header>Acme · Pricing</header>
<main>
<div class="card"><h2>Starter</h2><div class="price">$9</div>
<input placeholder="Email address"><select><option>Monthly</option></select>
<label><input type="checkbox" style="display:inline;width:auto"> Accept terms</label><button type="button">Choose</button></div>
<div class="card"><h2>Pro</h2><div class="price">$29</div>
<input type="date"><input type="range"><button type="button">Choose</button></div>
<div class="card"><h2>Team</h2><div class="price">$99</div>
<progress value="60" max="100" style="width:100%"></progress><select multiple><option>Seats</option><option>SSO</option></select><button type="button">Contact</button></div>
</main></body></html>
