<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chromascope fixture</title>
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      #box {
        width: 200px;
        height: 100px;
        background: #c00;
      }
      #tall {
        height: 3000px;
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
    <div id="tall"></div>
    <script>
      // Appears after the load event, for --wait-for.
      setTimeout(() => {
        const late = document.createElement("div");
        late.id = "late";
        late.style.cssText = "width: 50px; height: 40px; background: #00c";
        document.body.prepend(late);
      }, 300);
    </script>
  </body>
</html>
